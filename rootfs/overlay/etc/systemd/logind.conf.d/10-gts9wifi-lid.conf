# Tab S9 (SM-X710) 电源管理策略：
# 1. 禁用所有向内核发起的挂起操作（HandleLidSwitch / HandlePowerKey = lock）
# 2. 避免快速开合盖时的防抖延迟（HoldoffTimeoutSec=0）
# 3. 避免长时间空闲时触发 systemd 自动挂起

[Login]
HandlePowerKey=lock
HandlePowerKeyLongPress=poweroff
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=lock
IdleAction=lock
HoldoffTimeoutSec=0
